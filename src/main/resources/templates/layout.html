<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Spring Security CSRF Tokens pour HTMX -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">TournamentApp</title>

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Configuration HTMX pour transmettre le jeton CSRF automatiquement
        document.addEventListener('htmx:configRequest', function (evt) {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            if (csrfToken && csrfHeader) {
                evt.detail.headers[csrfHeader] = csrfToken;
            }
        });

        // Re-génération des icônes Lucide après chaque échange asynchrone HTMX
        document.addEventListener('htmx:afterSwap', function () {
            if (window.lucide) {
                lucide.createIcons();
            }
        });

        // Initialisation Lucide au chargement initial du DOM
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased min-h-screen flex flex-col"
      x-data="{ sidebarOpen: false }">

<div class="min-h-screen flex flex-1">

    <!-- ====== SIDEBAR DESKTOP ====== -->
    <aside class="hidden md:flex md:flex-col w-64 shrink-0 bg-white border-r border-slate-100 shadow-sm">
        <!-- Logo & Titre -->
        <div class="flex items-center gap-3 h-16 px-6 border-b border-slate-100">
            <span class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-md shadow-indigo-200">
                <i data-lucide="trophy" class="w-5 h-5 text-white"></i>
            </span>
            <span class="text-lg font-bold tracking-tight text-slate-900">
                Tournament<span class="text-indigo-600">App</span>
            </span>
        </div>

        <!-- Navigation principale -->
        <nav class="flex-1 px-3 py-5 space-y-0.5">
            <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-400">Navigation</p>

            <a th:href="@{/dashboard}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri == '/dashboard'} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <span th:classappend="${currentUri == '/dashboard'} ? 'text-indigo-600' : 'text-slate-400'">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </span>
                Tableau de bord
            </a>

            <a th:href="@{/tournaments}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/tournaments')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <span th:classappend="${currentUri != null and currentUri.startsWith('/tournaments')} ? 'text-indigo-600' : 'text-slate-400'">
                    <i data-lucide="trophy" class="w-5 h-5"></i>
                </span>
                Tournois
            </a>

            <a th:href="@{/teams}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/teams')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <span th:classappend="${currentUri != null and currentUri.startsWith('/teams')} ? 'text-indigo-600' : 'text-slate-400'">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </span>
                Equipes
            </a>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users/new}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/admin/users')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <span th:classappend="${currentUri != null and currentUri.startsWith('/admin/users')} ? 'text-indigo-600' : 'text-slate-400'">
                    <i data-lucide="user-round-plus" class="w-5 h-5"></i>
                </span>
                Utilisateurs
            </a>
        </nav>

        <!-- Profil & Deconnexion -->
        <div class="p-3 border-t border-slate-100">
            <div class="flex items-center gap-3 px-2 py-2 rounded-lg">
                <span class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0">
                    <i data-lucide="circle-user-round" class="w-5 h-5"></i>
                </span>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-semibold text-slate-900 truncate" sec:authentication="name">Utilisateur</p>
                    <p class="text-xs text-slate-400 truncate">Connecté</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="mt-1">
                <button type="submit"
                        class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-500 transition-all duration-150 hover:bg-red-50 hover:text-red-600 group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:text-red-500"></i>
                    Deconnexion
                </button>
            </form>
        </div>
    </aside>

    <!-- ====== OVERLAY MOBILE (Alpine.js) ====== -->
    <div x-show="sidebarOpen"
         x-transition:enter="transition-opacity ease-linear duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="md:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40"
         @click="sidebarOpen = false"
         style="display: none;"
         aria-hidden="true"></div>

    <!-- ====== SIDEBAR MOBILE (Alpine.js) ====== -->
    <aside x-show="sidebarOpen"
           x-transition:enter="transition ease-out duration-200 transform"
           x-transition:enter-start="-translate-x-full"
           x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-150 transform"
           x-transition:leave-start="translate-x-0"
           x-transition:leave-end="-translate-x-full"
           class="md:hidden fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-100 z-50 flex flex-col shadow-2xl"
           style="display: none;">

        <div class="flex items-center justify-between h-16 px-4 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <span class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-200">
                    <i data-lucide="trophy" class="w-5 h-5 text-white"></i>
                </span>
                <span class="text-lg font-bold text-slate-900">Tournament<span class="text-indigo-600">App</span></span>
            </div>
            <button @click="sidebarOpen = false"
                    class="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-all duration-150"
                    aria-label="Fermer le menu">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <nav class="flex-1 px-3 py-5 space-y-0.5">
            <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-400">Navigation</p>
            <a th:href="@{/dashboard}" @click="sidebarOpen = false"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri == '/dashboard'} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Tableau de bord
            </a>
            <a th:href="@{/tournaments}" @click="sidebarOpen = false"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/tournaments')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <i data-lucide="trophy" class="w-5 h-5"></i>
                Tournois
            </a>
            <a th:href="@{/teams}" @click="sidebarOpen = false"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/teams')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <i data-lucide="users" class="w-5 h-5"></i>
                Equipes
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users/new}" @click="sidebarOpen = false"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150"
               th:classappend="${currentUri != null and currentUri.startsWith('/admin/users')} ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'">
                <i data-lucide="user-round-plus" class="w-5 h-5"></i>
                Utilisateurs
            </a>
        </nav>

        <div class="p-3 border-t border-slate-100">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-500 transition-all duration-150 hover:bg-red-50 hover:text-red-600 group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:text-red-500"></i>
                    Deconnexion
                </button>
            </form>
        </div>
    </aside>

    <!-- ====== CONTENU PRINCIPAL ====== -->
    <div class="flex-1 flex flex-col min-w-0 bg-slate-50">

        <!-- Barre superieure mobile -->
        <header class="md:hidden sticky top-0 z-30 bg-white border-b border-slate-100 px-4 h-16 flex items-center justify-between shadow-sm">
            <button @click="sidebarOpen = true"
                    class="p-2 -ml-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-150"
                    aria-label="Ouvrir le menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>

            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i data-lucide="trophy" class="w-4 h-4"></i>
                </span>
                <span class="font-bold tracking-tight text-slate-900">Tournament<span class="text-indigo-600">App</span></span>
            </div>

            <div class="w-8"></div>
        </header>

        <!-- Contenu des pages -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"
              layout:fragment="content">
        </main>

        <!-- Pied de page -->
        <footer class="border-t border-slate-100 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400">
                <span class="font-medium">TournamentApp &mdash; Plateforme de gestion de tournois</span>
                <span class="inline-flex items-center gap-1.5">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i>
                    Session authentifiee
                </span>
            </div>
        </footer>
    </div>
</div>

<!-- ====== SYSTEME DE TOAST UNIFIE (Alpine.js) ====== -->
<div x-data="{
        toasts: [],
        add(message, type = 'success') {
            const id = Date.now() + Math.random();
            this.toasts.push({ id, message, type });
            setTimeout(() => this.remove(id), 4000);
            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        },
        remove(id) {
            this.toasts = this.toasts.filter(t => t.id !== id);
        }
     }"
     @toast.window="add($event.detail.message || 'Operation terminee avec succes', $event.detail.type || 'success')"
     class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">

    <!-- Declencheurs pour messages flash du serveur -->
    <template th:if="${errorMessage}">
        <div x-init="add('[[${errorMessage}]]', 'error')"></div>
    </template>
    <template th:if="${successMessage}">
        <div x-init="add('[[${successMessage}]]', 'success')"></div>
    </template>

    <!-- Liste des toasts dynamiques -->
    <template x-for="toast in toasts" :key="toast.id">
        <div x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-3 scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
             x-transition:leave-end="opacity-0 translate-y-3 scale-95"
             class="pointer-events-auto bg-white rounded-xl shadow-lg border p-4 flex items-start gap-3 border-slate-200"
             :class="{
                'border-emerald-200': toast.type === 'success',
                'border-red-200': toast.type === 'error',
                'border-slate-200': toast.type !== 'success' && toast.type !== 'error'
             }">

            <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                  :class="{
                    'bg-emerald-50 text-emerald-600': toast.type === 'success',
                    'bg-red-50 text-red-600': toast.type === 'error',
                    'bg-indigo-50 text-indigo-600': toast.type !== 'success' && toast.type !== 'error'
                  }">
                <i x-show="toast.type === 'success'" data-lucide="check-circle-2" class="w-5 h-5"></i>
                <i x-show="toast.type === 'error'" data-lucide="circle-alert" class="w-5 h-5"></i>
                <i x-show="toast.type !== 'success' && toast.type !== 'error'" data-lucide="info" class="w-5 h-5"></i>
            </span>

            <div class="flex-1 min-w-0 pt-0.5">
                <p class="text-sm font-medium text-slate-900" x-text="toast.message"></p>
            </div>

            <button @click="remove(toast.id)"
                    class="text-slate-400 hover:text-slate-600 p-1 rounded-md transition-all duration-200"
                    aria-label="Fermer la notification">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </template>
</div>

<!-- Initialisation de Lucide Icons -->
<script>
    lucide.createIcons();
</script>
</body>
</html>
