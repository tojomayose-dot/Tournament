<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 0.6rem; margin: 0.5rem 0; box-sizing: border-box; }
        button { width: 100%; padding: 0.6rem; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: #c0392b; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Connexion</h2>
        <p th:if="${param.error}" class="error">Identifiants incorrects.</p>
        <p th:if="${param.logout}" style="color: #27ae60;">Déconnecté avec succès.</p>
        <form th:action="@{/login}" method="post">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" required>
            <label>Mot de passe</label>
            <input type="password" name="password" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
