<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Créer un utilisateur</title>
</head>
<body>
<div layout:fragment="content">
    <nav class="mb-6 flex items-center gap-2 text-sm text-slate-500" aria-label="Fil d'ariane">
        <span class="inline-flex items-center gap-1.5">
            <i data-lucide="users" class="w-4 h-4"></i>
            Administration
        </span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
        <span class="font-semibold text-slate-900">Créer un utilisateur</span>
    </nav>

    <div class="max-w-3xl">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Créer un utilisateur</h1>
            <p class="mt-1 text-sm text-slate-500">
                Créez un compte et attribuez-lui un rôle d’utilisateur, d’opérateur ou de manager.
            </p>
        </div>

        <form th:action="@{/admin/users/new}" th:object="${registerRequest}" method="post"
              class="space-y-6" novalidate>
            <div th:if="${errorMessage}"
                 class="bg-red-50 border border-red-200 rounded-xl p-4 flex items-start gap-3">
                <i data-lucide="circle-alert" class="w-5 h-5 text-red-600 shrink-0"></i>
                <p class="text-sm font-medium text-red-800" th:text="${errorMessage}">Erreur</p>
            </div>

            <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50/50 flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                        <i data-lucide="user-round-plus" class="w-4 h-4"></i>
                    </span>
                    <h2 class="text-base font-bold text-slate-900">Informations du compte</h2>
                </div>

                <div class="p-6 space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">
                            Nom d’utilisateur <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="username" th:field="*{username}" autocomplete="username"
                               required
                               th:errorclass="'border-red-400 focus:ring-red-500 focus:border-red-500'"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                           class="mt-1.5 text-sm text-red-600"></p>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
                            Mot de passe <span class="text-red-500">*</span>
                        </label>
                        <input type="password" id="password" th:field="*{password}"
                               autocomplete="new-password" minlength="6" required
                               th:errorclass="'border-red-400 focus:ring-red-500 focus:border-red-500'"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <p class="mt-1.5 text-xs text-slate-500">Au moins 6 caractères.</p>
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                           class="mt-1.5 text-sm text-red-600"></p>
                    </div>

                    <div>
                        <label for="role" class="block text-sm font-medium text-slate-700 mb-1.5">
                            Rôle <span class="text-red-500">*</span>
                        </label>
                        <select id="role" th:field="*{role}" required
                                th:errorclass="'border-red-400 focus:ring-red-500 focus:border-red-500'"
                                class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="" disabled>Choisir un rôle</option>
                            <option th:each="role : ${roles}" th:value="${role}"
                                    th:text="${role.name() == 'MANAGER' ? 'Manager' : (role.name() == 'OPERATOR' ? 'Opérateur' : 'Utilisateur')}">
                                Rôle
                            </option>
                        </select>
                        <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}"
                           class="mt-1.5 text-sm text-red-600"></p>
                    </div>
                </div>
            </section>

            <div class="flex items-center justify-end gap-3">
                <a th:href="@{/dashboard}"
                   class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50">
                    Annuler
                </a>
                <button type="submit"
                        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <i data-lucide="user-round-plus" class="w-4 h-4"></i>
                    Créer l’utilisateur
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
