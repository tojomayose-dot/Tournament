<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Nouveau tournoi</title>
</head>
<body>
<div layout:fragment="content">

    <h1 th:text="${editId != null} ? 'Modifier le tournoi' : 'Créer un tournoi'">Créer un tournoi</h1>
    
    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form th:action="${editId != null} ? @{/tournaments/{id}/update(id=${editId})} : @{/tournaments}"th:object="${tournamentRequest}" method="post">

        <label>Nom du tournoi</label>
        <input type="text" th:field="*{name}">
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label>Sport</label>
        <input type="text" th:field="*{sport}">
        <p class="error" th:if="${#fields.hasErrors('sport')}" th:errors="*{sport}"></p>

        <label>Description</label>
        <textarea th:field="*{description}" rows="3"></textarea>
        <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

        <label>Date de début</label>
        <input type="date" th:field="*{startDate}">
        <p class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>

        <label>Date de fin</label>
        <input type="date" th:field="*{endDate}">
        <p class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></p>

        <label>Lieu</label>
        <input type="text" th:field="*{location}">

        <label>Nombre maximum d'équipes</label>
        <input type="number" th:field="*{maxTeams}">
        <p class="error" th:if="${#fields.hasErrors('maxTeams')}" th:errors="*{maxTeams}"></p>

        <label>Type de tournoi</label>
        <select th:field="*{type}">
            <option value="">-- Choisir --</option>
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
        </select>
        <p class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>

        <br>
        <button type="submit" class="btn">Créer</button>
        <a href="/tournaments" class="btn" style="background:#95a5a6;">Annuler</a>

    </form>

</div>
</body>
</html>
