<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Liste des tournois</title>
</head>
<body>
<div layout:fragment="content">

    <h1>Tournois</h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form method="get" style="display:flex; gap:1rem; align-items:end; margin-bottom:1rem;">
        <div>
            <label>Sport</label>
            <input type="text" name="sport" th:value="${selectedSport}">
        </div>
        <div>
            <label>Statut</label>
            <select name="status">
                <option value="">-- Tous --</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == selectedStatus}"></option>
            </select>
        </div>
        <button type="submit" class="btn">Filtrer</button>
    </form>

    <p sec:authorize="hasAnyRole('ADMIN','MANAGER')">
        <a href="/tournaments/new" class="btn">+ Nouveau tournoi</a>
    </p>

    <p th:if="${tournaments.isEmpty()}">Aucun tournoi enregistré pour le moment.</p>

    <table th:unless="${tournaments.isEmpty()}">
        <thead>
        <tr>
            <th>Nom</th>
            <th>Sport</th>
            <th>Type</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Lieu</th>
            <th>Statut</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tournaments}">
            <td th:text="${t.name}">Nom</td>
            <td th:text="${t.sport}">Sport</td>
            <td th:text="${t.type}">Type</td>
            <td th:text="${t.startDate}">Début</td>
            <td th:text="${t.endDate}">Fin</td>
            <td th:text="${t.location}">Lieu</td>
            <td th:text="${t.status}">Statut</td>
            <td>
                <a th:href="@{/tournaments/{id}(id=${t.id})}" class="btn">Détails</a>
                <a sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                th:href="@{/tournaments/{id}/edit(id=${t.id})}" class="btn">Modifier</a>
                <form sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                    th:action="@{/tournaments/{id}/delete(id=${t.id})}" method="post" style="display:inline;"
                    onsubmit="return confirm('Supprimer ce tournoi ?');">
                    <button type="submit" class="btn btn-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${totalPages > 1}" style="margin-top: 1rem;">
        Page <span th:text="${currentPage + 1}">1</span> sur <span th:text="${totalPages}">1</span>
        (<span th:text="${totalElements}">0</span> tournois au total)
    </p>

</div>
</body>
</html>
